
services:
  ecom-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://ecom-postgres:5432/ecom_db
    depends_on:
      ecom-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecom-app-network

  ecom-postgres:
    image: postgres:18.3
    container_name: ecom-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ecom_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ecom_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ecom_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ecom-app-network

volumes:
  ecom_postgres_data:
networks:
  ecom-app-network:
    driver: bridge
    external: true
    name: ecom-app-network
