# Application Configuration
spring:
  application:
    name: ecom-app

  # PostgreSQL Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Order Reservation & Expiry Configuration
app:
  order:
    reservation-expiry-minutes: ${ORDER_RESERVATION_EXPIRY_MINUTES:15}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always